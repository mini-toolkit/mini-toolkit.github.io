<body data-tool-id="text-counter">
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="../">
        <span class="brand-badge">MT</span>

  <main class="container">
    <a class="back-btn" href="../"><span data-i18n="back.tools">← 모든 툴 보기</span></a>
    <div class="page-header">
      <h1 class="page-title">글자수 &amp; 바이트 계산기</h1>
      <p class="page-desc">공백 포함/제외 글자수, 단어 수, UTF-8 바이트 크기를 실시간으로 확인합니다.</p>
    </div>

    <div class="panel">
      <label class="field-label" for="tc-input" data-i18n="tc.in">텍스트 입력</label>
      <textarea id="tc-input" class="code-area" placeholder="여기에 텍스트를 입력하면 글자수와 바이트를 실시간 계산합니다." data-i18n-placeholder="tc.ph.in"></textarea>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-value" id="tc-with-space">0</div><div class="stat-label" data-i18n="tc.ws">공백 포함</div></div>
        <div class="stat-box"><div class="stat-value" id="tc-no-space">0</div><div class="stat-label" data-i18n="tc.ns">공백 제외</div></div>
        <div class="stat-box"><div class="stat-value" id="tc-words">0</div><div class="stat-label" data-i18n="tc.wd">단어 수</div></div>
        <div class="stat-box"><div class="stat-value" id="tc-bytes">0</div><div class="stat-label" data-i18n="tc.by">UTF-8 바이트</div></div>
      </div>
    </div>

    <section class="panel comments-card" aria-labelledby="comments-title">
      <div class="comments-header">
        <h2 id="comments-title" data-i18n="comments.title">댓글</h2>
        <p data-i18n="comments.desc">사용 후기, 버그 제보, 기능 요청을 자유롭게 남겨주세요.</p>
